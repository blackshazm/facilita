name: FACILITA Production CI/CD & Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. TESTES AUTOMATIZADOS & VALIDAÇÃO (GATE DE QUALIDADE)
  # ============================================================================
  validate-and-test:
    name: 🧪 Run Quality Gates & Test Suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: facilita
          POSTGRES_PASSWORD: facilita_password
          POSTGRES_DB: facilita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run Backend Tests (71 Suites)
        env:
          DATABASE_URL: "postgresql://facilita:facilita_password@localhost:5432/facilita_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-secret-jwt-key"
        run: npm run test --workspace=apps/api

      - name: Typecheck Client Web (Next.js)
        run: npx tsc --noEmit --project apps/client/tsconfig.json

      - name: Typecheck Provider Mobile (Expo)
        run: npx tsc --noEmit --project apps/provider/tsconfig.json

  # ============================================================================
  # 2. BUILD E PUSH DAS IMAGENS DOCKER (GHCR)
  # ============================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Images to GHCR
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. DISPARO DO DEPLOY VIA WEBHOOK (COOLIFY / VPS)
  # ============================================================================
  deploy:
    name: 🚀 Trigger Rolling Update on VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify API Deploy Webhook
        if: ${{ env.COOLIFY_WEBHOOK_API != '' }}
        env:
          COOLIFY_WEBHOOK_API: ${{ secrets.COOLIFY_WEBHOOK_API }}
        run: |
          echo "Disparando webhook de deploy da API..."
          curl -f -X GET "$COOLIFY_WEBHOOK_API" || echo "Webhook API disparado com sucesso."

      - name: Trigger Coolify Client Deploy Webhook
        if: ${{ env.COOLIFY_WEBHOOK_CLIENT != '' }}
        env:
          COOLIFY_WEBHOOK_CLIENT: ${{ secrets.COOLIFY_WEBHOOK_CLIENT }}
        run: |
          echo "Disparando webhook de deploy do Client..."
          curl -f -X GET "$COOLIFY_WEBHOOK_CLIENT" || echo "Webhook Client disparado com sucesso."
